<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação</title>

    <style>
        @keyframes pulsar {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        .btn-comprar:hover{
            animation: pulsar 2s infinite;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            font-family: Arial, sans-serif;
        }

        .btn-comprar {
            padding: 30px 100px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: green;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body>
    <div>
        <button class="btn-comprar">Comprar Agora</button>
    </div>
</body>
</html>
